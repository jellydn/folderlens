name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      - run: node --test tests/pi-reader.mjs
      - name: Build signed bundle, DMG, ZIP, and checksums
        run: sh scripts/release.sh
      - name: Sign update metadata and assets (dedicated FolderLens key)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          tools=$(sh scripts/sparkle-tools.sh)
          version=$(cargo metadata --locked --no-deps --format-version 1 | plutil -extract packages.0.version raw -o - -)
          python3 scripts/sign-release.py "$version" target/release/assets "$tools"
          target/release/FolderLens.app/Contents/MacOS/FolderLensUpdater --verify-release target/release/assets native/update-public-key.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: folderlens-${{ github.ref_name }}-macos-arm64
          path: target/release/assets/*
          if-no-files-found: error
          compression-level: 0
      - name: Prepare current release notes
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            NR == 1 && index($0, "## FolderLens " substr(tag, 2) " — ") != 1 { exit 1 }
            /^## (FolderLens|Shelf) / && ++sections > 1 { exit }
            { print }
          ' RELEASE_NOTES.md > target/release/notes.md
      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          body_path: target/release/notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/release/assets/*.dmg
            target/release/assets/*.zip
            target/release/assets/SHA256SUMS
            target/release/assets/*.sig
            target/release/assets/update.json
