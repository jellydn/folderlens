[package]
name = "folderlens"
version = "0.5.0"
edition = "2021"
publish = false
description = "Review what a cleanup level would tick, then move a confirmed selection to the Trash."

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "86df731b7171f52c9918f288784dda6ed0327289" }
security-framework = "3"
ureq = { version = "~3.5", default-features = false, features = ["json", "native-tls-no-default"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2"
